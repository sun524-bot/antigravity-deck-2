<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0d14">
  <title>Antigravity Live Gateway</title>
  <style>
    :root {
      --bg: #0a0d14;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(56, 189, 248, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 18px; font-weight: 700; color: var(--accent); }
    p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 10px;
      display: inline-block;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2>🚀 Antigravity Live Gateway</h2>
    <p id="status-text">Resolving live active laptop tunnel...</p>
    <a href="#" class="btn hidden" id="manual-btn">Open Control Deck</a>
  </div>

  <script>
    const GIST_ID = '1e5db360ce0ae208bad1c26709c55462';
    const params = new URLSearchParams(window.location.search);
    const authToken = params.get('auth') || 'c85e4f126814fb14';
    const statusText = document.getElementById('status-text');
    const manualBtn = document.getElementById('manual-btn');
    const spinner = document.getElementById('spinner');

    async function resolveAndRedirect() {
      try {
        // Fetch secret Gist metadata with cache-busting
        const gistApiUrl = `https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`;
        const res = await fetch(gistApiUrl, { cache: 'no-store' });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        // Find tunnel URL in tunnel.json or first file
        let liveUrl = null;
        if (data.files && data.files['tunnel.json']) {
          const content = JSON.parse(data.files['tunnel.json'].content);
          liveUrl = content.url;
        } else if (data.files) {
          const firstFile = Object.values(data.files)[0];
          try {
            const content = JSON.parse(firstFile.content);
            liveUrl = content.url || firstFile.content.trim();
          } catch {
            liveUrl = firstFile.content.trim();
          }
        }

        if (liveUrl) {
          const target = `${liveUrl.replace(/\/$/, '')}/?auth=${encodeURIComponent(authToken)}`;
          statusText.innerText = 'Connecting to live laptop tunnel...';
          manualBtn.href = target;
          manualBtn.classList.remove('hidden');
          // Perform instant 302-style client redirect
          window.location.replace(target);
        } else {
          throw new Error('No active tunnel URL found in Gist.');
        }
      } catch (err) {
        spinner.classList.add('hidden');
        statusText.innerText = `⚠️ Laptop is currently offline or tunnel is initializing. (${err.message})`;
      }
    }

    resolveAndRedirect();
  </script>
</body>
</html>
